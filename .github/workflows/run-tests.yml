name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          # Upcoming PHP release (nightly build): allowed to fail.
          - os: ubuntu-latest
            php: 8.6
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            experimental: true
          - os: ubuntu-latest
            php: 8.6
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
            experimental: true

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}${{ matrix.experimental && ' (experimental)' || '' }}

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: List Installed Dependencies
        run: composer show -D

      # The PostgreSQL tests run in the integration job.
      - name: Execute tests
        run: vendor/bin/pest --ci --exclude-group=pgsql

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        postgres: [18]
        postgis: ['3.6']
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          # Older supported PostgreSQL versions (compatibility is guaranteed from PostgreSQL 15).
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            stability: prefer-lowest
            postgres: 15
            postgis: '3.5'
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            postgres: 16
            postgis: '3.5'
          - php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            postgres: 17
            postgis: '3.5'
          # Upcoming PHP release (nightly build): allowed to fail.
          - php: 8.6
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            postgres: 18
            postgis: '3.6'
            experimental: true

    name: PostgreSQL ${{ matrix.postgres }} - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}${{ matrix.experimental && ' (experimental)' || '' }}

    continue-on-error: ${{ matrix.experimental == true }}

    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgres }}-${{ matrix.postgis }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgarray_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGARRAY_DB_HOST: 127.0.0.1
      PGARRAY_DB_PORT: 5432
      PGARRAY_DB_DATABASE: pgarray_testing
      PGARRAY_DB_USERNAME: postgres
      PGARRAY_DB_PASSWORD: postgres
      # Fail instead of skipping when PostgreSQL or an extension is missing.
      PGARRAY_REQUIRE_DB: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pgvector
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update && apt-get install -y --no-install-recommends postgresql-${{ matrix.postgres }}-pgvector"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: Execute PostgreSQL tests
        run: vendor/bin/pest --ci --group=pgsql
